<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Align Simulator</title>
<style>
  :root {
    --bg: #0b0e13; --panel: #14181e; --panel2: #1b2028; --text: #e8ebf0; --dim: #8b93a1;
    --blue: #37a0f4; --good: #39c47f; --warn: #f5a623; --bad: #f05d5d; --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; min-height: 100vh; }
  .wrap { display: grid; grid-template-columns: minmax(420px, 1.25fr) minmax(320px, 1fr); gap: 20px; max-width: 1240px; margin: 0 auto; padding: 18px 16px; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }

  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .4px; }
  .badge.sim { background: #3a2b10; color: var(--warn); border: 1px solid #5c451d; }
  .badge.pro { background: #10303a; color: var(--blue); border: 1px solid #1d4a5c; }
  #replay.pulse { animation: pulse 1.2s ease-in-out infinite; }
  .insight small.evidence { display: block; margin-top: 3px; color: var(--blue); opacity: .85; }
  .row.changed .val { font-weight: 700; }
  @keyframes flash { 0% { background: rgba(94, 200, 255, .25); } 100% { background: transparent; } }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(94, 200, 255, .6); } 50% { box-shadow: 0 0 0 8px rgba(94, 200, 255, 0); } }

  header { max-width: 1240px; margin: 0 auto; padding: 14px 16px 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 20px; } header .sub { color: var(--dim); font-size: 13px; }

  /* ------- Echo Show frame ------- */
  .device { background: #000; border-radius: 22px; padding: 16px 16px 26px; border: 1px solid #23262c; box-shadow: 0 18px 60px rgba(0,0,0,.55); }
  .screen { background: linear-gradient(160deg, #10141b, #0c1016); border-radius: 10px; min-height: 480px; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; position: relative; }
  .statusbar { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; }
  .content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; }
  .listen { height: 5px; border-radius: 3px; background: #11202e; overflow: hidden; }
  .listen.on::after { content: ""; display: block; height: 100%; width: 40%; background: var(--blue); border-radius: 3px; animation: sweep 1s infinite alternate ease-in-out; }
  @keyframes sweep { from { transform: translateX(-10%);} to { transform: translateX(180%);} }
  .caption { min-height: 38px; color: var(--text); font-size: 15px; }
  .caption .who { color: var(--blue); font-weight: 600; margin-right: 6px; }
  .stand { width: 120px; height: 10px; margin: 14px auto 0; background: #15181d; border-radius: 0 0 10px 10px; }

  .card { background: linear-gradient(180deg, #161b22, #12161c); border: 1px solid #242a34; border-radius: var(--radius); padding: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.03); }
  .card h3 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .dom { width: 86px; color: var(--dim); font-size: 13px; text-transform: capitalize; }
  .bar { flex: 1; height: 11px; border-radius: 6px; background: #0c1016; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.6); }
  /* The "liquid": a gradient fill that slides to its new level and fades to its new colour. */
  .bar i { display: block; height: 100%; border-radius: 6px; position: relative;
    transition: width 1.15s cubic-bezier(.22,.61,.36,1), background-color 1.15s ease, box-shadow 1.15s ease; }
  .bar i::after { content: ""; position: absolute; inset: 0; border-radius: 6px;
    background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 55%, rgba(0,0,0,.18)); }
  .bar i.good { background-color: var(--good); box-shadow: 0 0 10px rgba(57,196,127,.35); }
  .bar i.warn { background-color: var(--warn); box-shadow: 0 0 10px rgba(245,166,35,.35); }
  .bar i.bad  { background-color: var(--bad);  box-shadow: 0 0 10px rgba(240,93,93,.35); }
  .bar i.none { background-color: #39424f; box-shadow: none; }
  .val { width: 64px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13.5px; font-weight: 600; transition: color .4s ease; }
  .val.rising { color: var(--good); } .val.falling { color: var(--bad); }
  .trend { width: 16px; text-align: center; }

  .insight { border-left: 3px solid var(--warn); padding-left: 10px; margin: 7px 0; }
  .insight.sev3 { border-color: var(--bad); }
  .insight small { color: var(--dim); display: block; margin-top: 2px; }
  .q { background: var(--panel2); border: 1px dashed #2c3340; border-radius: 10px; padding: 10px 12px; color: var(--blue); }

  .change { display: flex; gap: 9px; padding: 5px 0; align-items: baseline; }
  .change .op { width: 20px; text-align: center; font-weight: 700; }
  .change .op.add { color: var(--good); } .change .op.move { color: var(--warn); }
  .ok { color: var(--good); } .dimtxt { color: var(--dim); font-size: 13px; }

  /* ------- right: conversation ------- */
  .side { display: flex; flex-direction: column; gap: 12px; }
  .log { background: var(--panel); border: 1px solid #232832; border-radius: var(--radius); padding: 14px; flex: 1; min-height: 300px; max-height: 430px; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; }
  .msg { max-width: 92%; padding: 9px 13px; border-radius: 14px; font-size: 14px; line-height: 1.45; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .msg.user { align-self: flex-end; background: linear-gradient(180deg, #1a3a55, #16324a); border-bottom-right-radius: 5px; }
  .msg.alexa { align-self: flex-start; background: linear-gradient(180deg, #1e242d, #1a1f27); border-bottom-left-radius: 5px; }
  .msg .tools { margin-top: 5px; color: var(--dim); font-size: 11.5px; }
  .inputrow { display: flex; gap: 8px; }
  input[type=text] { flex: 1; background: var(--panel); color: var(--text); border: 1px solid #2a2f3a; border-radius: 10px; padding: 11px 13px; font-size: 14px; }
  button { background: var(--panel2); color: var(--text); border: 1px solid #2c3340; border-radius: 10px; padding: 10px 14px; cursor: pointer; font-size: 14px; }
  button:hover { border-color: var(--blue); background: #1f2631; }
  button:active { transform: translateY(1px); }
  input[type=text]:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(55,160,244,.18); }
  button.mic.on { background: #16324a; border-color: var(--blue); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chips button { font-size: 12.5px; padding: 6px 11px; border-radius: 999px; }
  .toggles { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 13px; flex-wrap: wrap; }
  .dotmode .content, .dotmode .statusbar { display: none; }
  .ring { display: none; margin: auto; width: 150px; height: 150px; border-radius: 50%; border: 6px solid #11202e; }
  .dotmode .ring { display: block; } .dotmode .ring.on { border-color: var(--blue); box-shadow: 0 0 40px rgba(55,160,244,.4); }
</style>
</head>
<body>
<header>
  <h1>Align</h1>
  <span class="badge sim">SIMULATED ALEXA+ HOST</span>
  <span class="sub">The MCP server behind this page is real — this host stands in for Alexa+ (deployment is private preview). Proactive turns use the host channel we're requesting from Amazon.</span>
</header>
<div class="wrap">
  <div class="device">
    <div class="screen" id="screen">
      <div class="statusbar"><span id="clock">Monday 7:02 AM</span><span>Align</span></div>
      <div class="content" id="content">
        <div class="card dimtxt">Waking up…</div>
      </div>
      <div class="ring" id="ring"></div>
      <div class="listen" id="listen"></div>
      <div class="caption" id="caption"></div>
    </div>
    <div class="stand"></div>
  </div>

  <div class="side">
    <div class="toggles">
      <button id="mic" class="mic">🎙 Speak</button>
      <label><input type="checkbox" id="tts" checked /> voice replies</label>
      <button id="replay" title="Hear the last reply again">🔊 Replay</button>
      <span id="voicehint" class="dimtxt" style="font-size:12px"></span>
      <label><input type="checkbox" id="dot" /> Echo Dot (voice-only) mode</label>
      <button id="jump" title="Advance the demo clock 7 days">⏭ One week later</button>
      <button id="reset" title="Re-seed the demo">↺ Reset</button>
      <button id="fresh" title="Blank mind — Align meets a brand-new user">🆕 New user</button>
      <span id="brain" class="dimtxt"></span>
    </div>
    <div class="log" id="log"></div>
    <div class="chips" id="chips">
      <button>How's my week looking?</button>
      <button>Tell me more</button>
      <button>Fix it</button>
      <button>Yes, do it</button>
      <button>How am I doing on my goals?</button>
      <button>Actually, I hate morning gym</button>
      <button>What if I take a client dinner on Thursday at 7pm?</button>
      <button>How did my week go?</button>
      <button>I put in 450</button>
      <button>What do you know about me?</button>
    </div>
    <div class="inputrow">
      <input type="text" id="input" placeholder="Talk to Align… (or use the mic)" />
      <button id="send">Send</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
// Temporary conversational context lives in the server session; it survives a
// reload of this tab (sessionStorage) and expires with the tab. Durable memory
// never depends on it.
const session = sessionStorage.getItem("align-session") || ("sim-" + Math.random().toString(36).slice(2, 8));
sessionStorage.setItem("align-session", session);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- device screen renderers (the "hydrated" views an Alexa device would draw)
const color = (s) => (s === null ? "#39424f" : s >= 70 ? "var(--good)" : s >= 40 ? "var(--warn)" : "var(--bad)");
const arrow = { up: "▲", down: "▼", flat: "–" };

const tone = (sc) => (sc === null ? "none" : sc >= 70 ? "good" : sc >= 40 ? "warn" : "bad");
const trendColor = (t) => (t === "up" ? "var(--good)" : t === "down" ? "var(--bad)" : "var(--dim)");
function balanceCard(balance) {
  const rows = balance.map((b) => `
    <div class="row" data-domain="${esc(b.domain)}">
      <span class="dom">${esc(b.domain)}</span>
      <span class="bar"><i class="${tone(b.score)}" style="width:${b.score ?? 4}%"></i></span>
      <span class="val" data-score="${b.score === null ? "" : b.score}">${b.score === null ? "—" : b.score}</span>
      <span class="trend" style="color:${trendColor(b.trend)}">${arrow[b.trend] ?? "–"}</span>
    </div>`).join("");
  return `<div class="card" id="balance"><h3>Life balance <span class="dimtxt">this week · live</span></h3>${rows}</div>`;
}
// Numbers count up or down one by one (12, 13, 14…) while the bar slides.
function countTo(el, from, to) {
  if (from === to) { el.textContent = String(to); return; }
  const steps = Math.abs(to - from);
  const dur = Math.min(1100, 180 + steps * 28);
  const t0 = performance.now();
  el.classList.remove("rising", "falling");
  el.classList.add(to > from ? "rising" : "falling");
  const tick = (now) => {
    const k = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - k, 3);
    el.textContent = String(Math.round(from + (to - from) * eased));
    if (k < 1) requestAnimationFrame(tick);
    else setTimeout(() => el.classList.remove("rising", "falling"), 900);
  };
  requestAnimationFrame(tick);
}
// Apply fresh scores to the existing card so CSS transitions animate the change.
function applyBalance(balance) {
  const card = $("balance");
  if (!card) {
    const holder = document.createElement("div");
    holder.innerHTML = balanceCard(balance);
    $("content").prepend(holder.firstElementChild);
    return;
  }
  for (const b of balance) {
    const row = card.querySelector(`.row[data-domain="${b.domain}"]`);
    if (!row) continue;
    const fill = row.querySelector(".bar i");
    const val = row.querySelector(".val");
    const trend = row.querySelector(".trend");
    const prev = val.dataset.score === "" ? null : Number(val.dataset.score);
    fill.className = tone(b.score);
    fill.style.width = `${b.score ?? 4}%`;
    if (b.score === null) val.textContent = "—";
    else if (prev === null) val.textContent = String(b.score);
    else countTo(val, prev, b.score);
    val.dataset.score = b.score === null ? "" : String(b.score);
    trend.style.color = trendColor(b.trend);
    trend.textContent = arrow[b.trend] ?? "–";
  }
}
// Refresh the widget after every turn: check-ins ("I skipped gym Friday"),
// completions and applied plans change the scores the engine computes.
async function refreshBalance() {
  try {
    const d = await fetch("/balance").then((x) => x.json());
    applyBalance(d.balance || []);
  } catch { /* server unreachable: keep the last widget */ }
}
// "Evidence: 4 events · 2 goals · 1 thing you said · 1 alternative explanation" — the basis, visible.
function evidenceLine(i) {
  const e = i.evidence_summary;
  if (!e) return "";
  const parts = [];
  if (e.events) parts.push(`${e.events} event${e.events === 1 ? "" : "s"}`);
  if (e.goals) parts.push(`${e.goals} goal${e.goals === 1 ? "" : "s"}`);
  if (e.stated) parts.push(`${e.stated} thing${e.stated === 1 ? "" : "s"} you said`);
  if (e.inferred) parts.push(`${e.inferred} inferred`);
  if (e.alternatives) parts.push(`${e.alternatives} alternative explanation${e.alternatives === 1 ? "" : "s"}`);
  const conf = typeof i.confidence === "number" ? ` · confidence ${Math.round(i.confidence * 100)}%${i.confidence < 0.75 ? " (working read)" : ""}` : "";
  return parts.length ? `<small class="evidence">Evidence: ${parts.join(" · ")}${conf}</small>` : "";
}
function insightsCard(insights, question) {
  const items = insights.map((i) => `
    <div class="insight sev${i.severity}"><div>${esc(i.title)}</div><small>${i.domains.map(esc).join(" · ")}</small>${evidenceLine(i)}</div>`).join("");
  const q = question ? `<div class="q">❓ ${esc(question.text)}</div>` : "";
  return `<div class="card"><h3>What I noticed</h3>${items || '<span class="dimtxt">All clear.</span>'}${q}</div>`;
}
function planCard(d) {
  const rows = (d.changes || []).map((c) => c.op === "create"
    ? `<div class="change"><span class="op add">＋</span><span>${esc(c.title)} <span class="dimtxt">${esc((c.start || "").slice(0, 16).replace("T", " "))}</span></span></div>`
    : `<div class="change"><span class="op move">→</span><span>${esc(c.title)} <span class="dimtxt">moves to ${esc((c.to?.start || "").slice(0, 16).replace("T", " "))}</span></span></div>`).join("");
  return `<div class="card"><h3>Proposed plan <span class="badge pro">needs your yes</span></h3>${rows}
    <div class="dimtxt" style="margin-top:8px">Trade-offs: ${esc(d.tradeoffs || "none")}</div></div>`;
}
function appliedCard(d) {
  const rows = (d.executed || []).map((e) => `<div class="change"><span class="op ${e.ok ? "add" : "move"}">${e.ok ? "✓" : "✗"}</span><span>${esc(e.detail)}</span></div>`).join("");
  return `<div class="card"><h3>Applied <span class="${d.allVerified ? "ok" : ""}">${d.allVerified ? "all changes verified" : "partial"}</span></h3>${rows}</div>`;
}
function outcomesCard(d) {
  const rows = (d.outcomes || []).map((o) => {
    const unknown = o.unknown ? ` · ${o.unknown} unconfirmed` : "";
    const mark = o.verdict === "improved" ? "✓" : o.verdict === "inconclusive" ? "?" : "•";
    return `<div class="change"><span class="op ${o.verdict === "improved" ? "add" : "move"}">${mark}</span>
    <span>${esc(o.metric.replace("_adherence", ""))}: ${o.baseline === null ? "no baseline" : o.baseline} → ${o.confirmed ?? o.observed} confirmed of ${o.scheduled ?? "?"} scheduled <span class="dimtxt">(${esc(o.verdict)}${unknown})</span></span></div>`;
  }).join("");
  return `<div class="card"><h3>Measured results <span class="badge pro">confirmed evidence only</span></h3>${rows || '<span class="dimtxt">Nothing measured yet.</span>'}</div>`;
}
function goalsCard(d) {
  const rows = (d.goals || []).map((g) => `
    <div class="row"><span class="dom">${esc(g.domain)}</span>
      <span class="bar"><i style="width:${Math.min(100, (g.actual / (g.target || 1)) * 100)}%; background:${g.actual >= g.target ? "var(--good)" : "var(--warn)"}"></i></span>
      <span class="val">${g.actual}/${g.target}</span><span class="dimtxt">${g.streak_weeks ? g.streak_weeks + "w streak" : ""}</span></div>`).join("");
  return `<div class="card"><h3>Goals</h3>${rows}</div>`;
}
function simCard(d) {
  const conflicts = (d.conflicts || []).map((c) => `<div class="change"><span class="op move">✗</span><span>collides with ${esc(c.title)} <span class="dimtxt">${esc((c.start || "").slice(11, 16))}</span></span></div>`).join("");
  const risks = (d.new_risks || []).map((r) => `<div class="change"><span class="op move">⚠</span><span>${esc(r)}</span></div>`).join("");
  const verdict = d.recommendation === "safe"
    ? '<div class="change"><span class="op add">✓</span><span>Fits — no conflicts, no goals lost</span></div>'
    : '<div class="dimtxt" style="margin-top:8px">Recommendation: pick a different slot</div>';
  return `<div class="card"><h3>What-if: ${esc(d.hypothetical?.title || "")} <span class="badge pro">SIMULATED FUTURE</span></h3>${conflicts}${risks}${d.recommendation === "safe" ? verdict : conflicts || risks ? verdict : ""}</div>`;
}
function memoryCard(d) {
  const rows = (d.memories || []).slice(0, 8).map((m) => `<div class="change"><span class="op dimtxt">${esc(m.kind[0].toUpperCase())}</span><span>${esc(m.content)}</span></div>`).join("");
  return `<div class="card"><h3>What I remember <span class="dimtxt">say "forget …" to delete</span></h3>${rows}</div>`;
}

function render(toolCalls, proactiveData) {
  const html = [];
  const datas = proactiveData ? [["get_daily_briefing", proactiveData]] : toolCalls.map((c) => [c.name, c.data || {}]);
  for (const [name, d] of datas) {
    if (name === "get_daily_briefing") {
      if ((d.outcomes || []).length) html.push(outcomesCard(d));
      html.push($("balance") ? $("balance").outerHTML : balanceCard(d.balance || []), insightsCard(d.insights || [], d.question));
    }
    else if (name === "get_life_balance") html.push($("balance") ? $("balance").outerHTML : balanceCard(d.balance || []));
    else if (name === "get_insight") html.push(insightsCard([{ title: d.title, severity: d.severity, domains: d.domains || [], confidence: d.confidence, evidence_summary: d.evidence_summary }], null));
    else if (name === "propose_plan") html.push(planCard(d));
    else if (name === "apply_plan") html.push(appliedCard(d));
    else if (name === "whats_changed") html.push(outcomesCard(d));
    else if (name === "get_goal_progress") html.push(goalsCard(d));
    else if (name === "review_memory") html.push(memoryCard(d));
    else if (name === "simulate_change") html.push(simCard(d));
  }
  if (html.length) {
    const keep = html.some((h) => h.includes('id="balance"')) ? "" : ($("balance")?.outerHTML ?? "");
    $("content").innerHTML = keep + html.join("");
  }
}

// ---------- conversation
function addMsg(role, text, tools) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = esc(text) + (tools?.length ? `<div class="tools">⚙ MCP: ${tools.map((t) => esc(t.name)).join(" → ")}</div>` : "");
  $("log").appendChild(div);
  $("log").scrollTop = 1e9;
}
// Pin Align to the best available ENGLISH voice (the browser default follows the
// OS locale — on a French Windows that would read English with a French voice).
let alignVoice = null;
function pickVoice() {
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const score = (v) =>
    (/en[-_]US/i.test(v.lang) ? 2 : /^en/i.test(v.lang) ? 1 : -10) +
    (/natural/i.test(v.name) ? 4 : 0) +            // Edge neural voices (best)
    (/google us english/i.test(v.name) ? 3 : 0) +  // Chrome online voice
    (/aria|jenny|guy|zira|mark/i.test(v.name) ? 1 : 0);
  alignVoice = vs.slice().sort((a, b) => score(b) - score(a))[0] || null;
  // No English voice: leave the browser's default (original behaviour) and say so.
  const noEnglish = !!alignVoice && score(alignVoice) < 0;
  if (noEnglish) alignVoice = null;
  const hint = $("voicehint");
  if (hint) hint.textContent = vs.length === 0 ? "no speech voices available in this browser" : noEnglish ? "no English voice installed — using the browser default voice" : "";
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

// Align speaks as soon as a reply arrives. Some browsers refuse speech before
// the first click; in that case the text is queued behind the pulsing 🔊
// button and played on the first interaction. 🔊 also replays the last reply.
let lastSpoken = null;
let pendingSpeech = null;
function speak(text, who, force = false) {
  $("caption").innerHTML = `<span class="who">${who}</span>${esc(text)}`;
  lastSpoken = text;
  if (!$("tts").checked || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  if (alignVoice) u.voice = alignVoice;
  u.rate = 1.04;
  $("ring").classList.add("on");
  // On-screen speech status, so a silent machine can be diagnosed without DevTools.
  const status = (msg) => { $("voicehint").textContent = msg; };
  if (speechSynthesis.getVoices().length === 0) status("no voices loaded in this browser yet — press 🔊 Replay again in a second");
  u.onstart = () => status(`speaking with ${u.voice ? u.voice.name.replace(/^Microsoft |^Google /, "") : "the browser default voice"}`);
  u.onend = () => { $("ring").classList.remove("on"); status(""); pickVoice(); };
  // Speak right away. Only if the browser refuses (no click yet) is the text
  // queued behind the pulsing 🔊 button, to be played on the first click.
  u.onerror = (e) => {
    $("ring").classList.remove("on");
    status(`speech error: ${e.error}`);
    if (e.error === "not-allowed" && !force) { pendingSpeech = text; $("replay").classList.add("pulse"); status("click 🔊 Replay to hear it (the browser blocks speech before the first click)"); }
  };
  speechSynthesis.speak(u);
}
window.addEventListener("pointerdown", () => {
  if (pendingSpeech) { const t = pendingSpeech; pendingSpeech = null; $("replay").classList.remove("pulse"); setTimeout(() => speak(t, "Align", true), 50); }
}, { capture: true });
$("replay").onclick = () => { if (lastSpoken) { pendingSpeech = null; $("replay").classList.remove("pulse"); speak(lastSpoken, "Align", true); } };
async function send(text) {
  if (!text.trim()) return;
  addMsg("user", text);
  speakCaption(text);
  $("listen").classList.add("on");
  try {
    const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: session, text }) });
    const out = await r.json();
    addMsg("alexa", out.reply, out.toolCalls);
    render(out.toolCalls);
    refreshBalance();
    speak(out.reply, "Align");
  } catch (e) { addMsg("alexa", "Connection problem: " + e.message); }
  $("listen").classList.remove("on");
}
function speakCaption(text) { $("caption").innerHTML = `<span class="who" style="color:var(--dim)">You</span>${esc(text)}`; }

// ---------- proactive opening: Align speaks FIRST (simulated host channel)
async function proactive() {
  try {
    const r = await fetch("/proactive?session_id=" + session).then((x) => x.json());
    const h = await fetch("/healthz").then((x) => x.json());
    $("brain").textContent = "brain: " + (h.brain || "rules") + " · demo day: " + (h.today || "");
    if (r.quiet) { $("content").innerHTML = '<div class="card dimtxt">Nothing needs your attention right now — Align stays quiet.</div>'; refreshBalance(); return; }
    addMsg("alexa", "🔔 PROACTIVE (simulated host channel): " + r.text);
    render([], r.data);
    refreshBalance();
    speak(r.text, "Align");
  } catch (e) { $("content").innerHTML = '<div class="card dimtxt">Server unreachable: ' + esc(e.message) + "</div>"; }
}
proactive();

$("jump").onclick = async () => {
  const r = await fetch("/demo/advance", { method: "POST" }).then((x) => x.json());
  addMsg("alexa", "— ⏭ one week later (" + r.today + ") —");
  proactive();
};
$("reset").onclick = async () => { await fetch("/demo/reset", { method: "POST" }); location.reload(); };
$("fresh").onclick = async () => { await fetch("/demo/fresh", { method: "POST" }); location.reload(); };

// ---------- input wiring
$("send").onclick = () => { send($("input").value); $("input").value = ""; };
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter") { send($("input").value); $("input").value = ""; } });
$("chips").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") send(e.target.textContent); });
$("dot").addEventListener("change", (e) => $("screen").classList.toggle("dotmode", e.target.checked));

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const rec = new SR();
  rec.lang = "en-US"; rec.interimResults = false;
  let on = false;
  $("mic").onclick = () => { on ? rec.stop() : rec.start(); };
  rec.onstart = () => { on = true; $("mic").classList.add("on"); $("listen").classList.add("on"); };
  rec.onend = () => { on = false; $("mic").classList.remove("on"); $("listen").classList.remove("on"); };
  rec.onresult = (e) => send(e.results[0][0].transcript);
} else { $("mic").disabled = true; $("mic").textContent = "mic n/a"; }

// clock
const WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
setInterval(() => { const d = new Date(); $("clock").textContent = `${WD[d.getDay()]} ${d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`; }, 1000);
</script>
</body>
